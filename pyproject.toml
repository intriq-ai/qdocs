[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qdocs"
version = "0.1.0"
description = "General-purpose document conversion, export, and revision management"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.14"
authors = [
    { name = "Intriq AI", email = "engineering@intriq.ai" }
]
keywords = ["documents", "pdf", "markdown", "docx", "xlsx", "conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "duckdb>=1.5",
    "loguru>=0.7",
    "httpx>=0.28",
    "rich>=13.0",
    "typer>=0.12",
    "clypi>=1.9.0",
    "toml>=0.10.2",
    "pygments>=2.20.0",
    "markdown>=3.10.2",
    "beautifulsoup4>=4.15.0",
    "Pillow>=12.2.0",
    "python-docx>=1.2.0",
    "docx2pdf>=0.1.8",
    "pdf2docx>=0.5.13",
    "pdfplumber>=0.11.9",
    "python-pptx>=1.0.2",
    "playwright>=1.60.0",
    "reportlab>=4.5.1",
    "svglib>=1.6.0",
    "openpyxl>=3.1.5",
    "mcp>=0.1.0",
]

[project.scripts]
qdocs = "qdocs.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qdocs"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
